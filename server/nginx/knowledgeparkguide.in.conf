server {
    server_name knowledgeparkguide.in www.knowledgeparkguide.in;
    root /var/www/knowledgeparkguide.in;
    index index.php;
    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / { try_files $uri $uri/ /index.php?$args; }
    # before the \.php$ block: nginx uses the first regex location that matches
    location ~* ^/(readme\.html|license\.txt|wp-config-sample\.php)$ { deny all; }
    location = /wp-login.php {
        limit_req zone=kpg_login burst=5 nodelay;
        limit_req_status 429;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location = /xmlrpc.php { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ { expires 30d; access_log off; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/knowledgeparkguide.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/knowledgeparkguide.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.knowledgeparkguide.in) {
        return 301 https://knowledgeparkguide.in$request_uri;
    } # managed by Certbot


    if ($host = knowledgeparkguide.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name knowledgeparkguide.in www.knowledgeparkguide.in;
    return 404; # managed by Certbot




}